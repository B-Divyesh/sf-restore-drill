name: Real Docker claim

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/public/demo/**'
      - '.factory/evidence/**'
      - '.factory/handoff.md'
      - '.factory/polish-*.md'
      - '.factory/review-*.md'

jobs:
  real-docker-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run real Postgres restore claim
        env:
          RESTORE_DRILL_CAPTURE_DIR: ${{ github.workspace }}/site/public/demo
        run: npm run test:docker:local
      - uses: actions/upload-artifact@v4
        with:
          name: real-demo-evidence
          path: |
            site/public/demo/demo-recording.json
            site/public/demo/sample-report.json
