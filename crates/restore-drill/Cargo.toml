[package]
name = "restore-drill"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Prove that a Postgres backup restores into a usable isolated environment"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-restore-drill"
readme = "../../README.md"
keywords = ["postgres", "backup", "restore", "docker", "devops"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "restore-drill"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
flate2 = "1.0"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
url = "2.5"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
